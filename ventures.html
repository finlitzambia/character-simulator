<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventures — FinLit Zambia</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --g:#22C55E;--gd:#15803D;--gx:#14532D;--gl:#F0FDF4;--gm:#DCFCE7;
  --ink:#111827;--ink2:#374151;--ink3:#6B7280;--bg:#F8FAFC;--w:#ffffff;--bd:#E5E7EB;--bd2:#F3F4F6;
  --red:#DC2626;--redl:#FEF2F2;--ff:'DM Sans',system-ui,sans-serif;--fm:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:40px}

.topbar{background:var(--w);border-bottom:1px solid var(--bd);padding:16px 20px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.back{color:var(--ink3);text-decoration:none;font-size:20px}
.topbar h1{font-size:16px;font-weight:800;flex:1}
.new-btn{background:var(--gd);color:#fff;border:none;border-radius:20px;
  padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}

.body{padding:16px 20px;max-width:640px;margin:0 auto}

.venture-card{background:var(--w);border:1px solid var(--bd);border-radius:15px;
  padding:16px 17px;margin-bottom:12px}
.vc-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.vc-name{font-size:14.5px;font-weight:800}
.vc-cat{font-size:11px;color:var(--ink3);text-transform:capitalize}
.vc-value{font-family:var(--fm);font-size:16px;font-weight:800;color:var(--gx)}
.vc-value.neg{color:var(--red)}

.vc-actions{display:flex;gap:8px;margin-top:10px}
.vc-btn{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--bd);
  background:var(--bg);font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}
.vc-pl{display:flex;gap:8px;margin:2px 0 8px}.vc-pl div{flex:1;background:var(--bd2);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--ink3)}.vc-pl b{display:block;font-size:13px;color:var(--ink);font-family:var(--fm)}.vc-pl b.neg{color:var(--red)}.vc-pl b.pos{color:var(--gd)}.vc-note{font-size:11.5px;color:var(--ink3);margin-top:4px}
.vc-btn.income{color:var(--gd);border-color:var(--gm)}
.vc-btn.expense{color:var(--red);border-color:#FCA5A5}

.empty{text-align:center;padding:50px 20px;color:var(--ink3);font-size:13px}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:20}
.modal-backdrop.show{display:block}
.modal{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--w);
  border-radius:20px 20px 0 0;padding:22px 20px 28px;z-index:21;max-width:640px;margin:0 auto}
.modal.show{display:block}
.modal h2{font-size:15px;font-weight:800;margin-bottom:16px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--bd);
  border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--bg)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--g);background:var(--w)}

.btn{width:100%;padding:12px;border-radius:11px;border:none;font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer;background:var(--gd);color:#fff;margin-top:4px}
.btn-secondary{background:none;color:var(--ink3);margin-top:8px}

.msg{font-size:12px;border-radius:8px;padding:9px 12px;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg.error{background:var(--redl);color:#7a1010}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">←</a>
  <h1>Ventures</h1>
  <button class="new-btn" onclick="openNewVenture()">+ New venture</button>
</div>

<div class="body">
  <div id="ventureList"></div>
</div>

<!-- New venture modal -->
<div class="modal-backdrop" id="newBackdrop" onclick="closeModals()"></div>
<div class="modal" id="newModal">
  <h2>Start a new venture</h2>
  <div class="msg" id="newMsg"></div>
  <div class="field">
    <label>Venture name</label>
    <input type="text" id="ventureName" placeholder="e.g. Chanda's Tuck Shop">
  </div>
  <div class="field">
    <label>Category</label>
    <select id="ventureCategory">
      <option value="retail">Retail / trading</option>
      <option value="services">Services</option>
      <option value="agriculture">Agriculture</option>
      <option value="tech">Tech / digital</option>
      <option value="other">Other</option>
    </select>
  </div>
  <div class="field">
    <label>Starting capital (from your cash)</label>
    <input type="number" id="startingCapital" min="1" step="0.01" placeholder="0">
  </div>
  <button class="btn" onclick="createVenture()">Launch venture</button>
  <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
</div>

<!-- Pay out / reinvest modal -->
<div class="modal-backdrop" id="payBackdrop" onclick="closeModals()"></div>
<div class="modal" id="payModal">
  <h2 id="payTitle">Manage profit</h2>
  <div class="msg" id="payMsg"></div>
  <div class="field-note" id="payInfo"></div>
  <div class="field"><label>Take home (to your cash)</label><input type="number" id="payWithdraw" min="0" step="0.01" placeholder="0"></div>
  <div class="field"><label>Reinvest (grow the business)</label><input type="number" id="payReinvest" min="0" step="0.01" placeholder="0"></div>
  <div class="field"><label>Add more of your own cash</label><input type="number" id="payTopup" min="0" step="0.01" placeholder="0"></div>
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn btn-secondary" style="margin:0" onclick="payPreset(1,0)">All home</button>
    <button class="btn btn-secondary" style="margin:0" onclick="payPreset(0.5,0.5)">Split</button>
    <button class="btn btn-secondary" style="margin:0" onclick="payPreset(0,1)">All reinvest</button>
  </div>
  <button class="btn" onclick="confirmPayout()">Confirm</button>
  <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
</div>

<!-- Log event modal -->
<div class="modal-backdrop" id="eventBackdrop" onclick="closeModals()"></div>
<div class="modal" id="eventModal">
  <h2 id="eventModalTitle">Log an event</h2>
  <div class="msg" id="eventMsg"></div>
  <div class="field">
    <label>Amount</label>
    <input type="number" id="eventAmount" min="0.01" step="0.01" placeholder="0">
  </div>
  <div class="field">
    <label>What happened?</label>
    <textarea id="eventDesc" rows="2" placeholder="e.g. Bought a new scale"></textarea>
  </div>
  <button class="btn" id="eventConfirmBtn" onclick="confirmEvent()">Log it</button>
  <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/story-client.js"></script>
<script>
let currentUser = null;
let currentCash = 0;
let activeVentureId = null;
let eventKind = 'expense';

(async function init() { await loadAll(); })();

async function loadAll() {
  currentUser = await requireAuth();
  if (!currentUser) return;
  if (window.StoryClient) await StoryClient.collect();

  const { data: profile } = await supabase
    .from('profiles').select('cash_balance').eq('id', currentUser.id).single();
  currentCash = Number(profile?.cash_balance || 0);

  const { data: ventures } = await supabase
    .from('ventures').select('*').eq('profile_id', currentUser.id).order('created_at', { ascending: false });

  const listEl = document.getElementById('ventureList');
  if (!ventures || !ventures.length) {
    listEl.innerHTML = '<div class="empty">No ventures yet. Start one to see how running a business affects your cash flow over time.</div>';
    return;
  }

  const cards = await Promise.all(ventures.map(async v => {
    const { data: events } = await supabase
      .from('venture_events').select('kind, amount').eq('venture_id', v.id);
    const evs = events || [];
    const cap = Number(v.capital ?? v.starting_capital);
    const retained = Number(v.retained || 0);
    const net = cap + retained;
    const rev = evs.filter(e => e.kind === 'revenue').reduce((s, e) => s + Number(e.amount), 0);
    const costs = -evs.filter(e => e.kind === 'expense' || e.kind === 'shock').reduce((s, e) => s + Number(e.amount), 0);
    const profit = rev - costs;
    const insured = v.insured_until && new Date(v.insured_until) > new Date();
    window.__v = window.__v || {}; window.__v[v.id] = { name: v.name, retained, cap };
    return `
      <div class="venture-card">
        <div class="vc-hdr">
          <div>
            <div class="vc-name">${v.name}</div>
            <div class="vc-cat">${v.category} \u00b7 ${v.status}</div>
          </div>
          <div class="vc-value ${net < 0 ? 'neg' : ''}">${fmtKwacha(net)}</div>
        </div>
        <div class="vc-pl">
          <div><span>Sales</span><b>${fmtKwacha(rev)}</b></div>
          <div><span>Costs &amp; losses</span><b>${fmtKwacha(costs)}</b></div>
          <div><span>Profit</span><b class="${profit < 0 ? 'neg' : 'pos'}">${fmtKwacha(profit)}</b></div>
        </div>
        <div class="vc-pl">
          <div><span>Working capital</span><b>${fmtKwacha(cap)}</b></div>
          <div><span>Profit in the business</span><b class="pos">${fmtKwacha(retained)}</b></div>
        </div>
        ${v.status === 'active' ? `
        <div class="vc-note">Sales and costs arrive automatically each day. Profit stays in the business until you decide what to do with it.</div>
        <div class="vc-note">${insured ? '\ud83d\udee1\ufe0f Covered against theft and spoilage until ' + new Date(v.insured_until).toLocaleDateString() : 'Not insured against theft or spoilage.'}</div>
        <div class="vc-actions">
          ${insured ? '' : `<button class="vc-btn income" onclick="buyCover(${v.id})">Buy cover</button>`}
          <button class="vc-btn income" onclick="openPay(${v.id})">Manage profit</button>
          <button class="vc-btn expense" onclick="openEvent(${v.id}, 'expense')">Record an expense</button>
        </div>` : ''}
      </div>`;
  }));

  listEl.innerHTML = cards.join('');
}

let payVentureId = null;
function openPay(id) {
  payVentureId = id; const v = window.__v[id];
  document.getElementById('payTitle').textContent = v.name;
  document.getElementById('payInfo').textContent = 'Profit in the business: ' + fmtKwacha(v.retained) + '. Money you take home is yours to spend. Money you reinvest grows the business, with returns that taper off as it gets very large.';
  ['payWithdraw','payReinvest','payTopup'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('payMsg').className = 'msg';
  document.getElementById('payBackdrop').classList.add('show');
  document.getElementById('payModal').classList.add('show');
}
function payPreset(w, r) {
  const v = window.__v[payVentureId];
  document.getElementById('payWithdraw').value = w ? (Math.floor(v.retained * w * 100) / 100) : '';
  document.getElementById('payReinvest').value = r ? (Math.floor(v.retained * r * 100) / 100) : '';
}
async function confirmPayout() {
  const msgEl = document.getElementById('payMsg');
  const w = parseFloat(document.getElementById('payWithdraw').value) || 0;
  const r = parseFloat(document.getElementById('payReinvest').value) || 0;
  const t = parseFloat(document.getElementById('payTopup').value) || 0;
  const { data: res, error } = await supabase.rpc('sim_venture_payout', {
    p_venture_id: payVentureId, p_withdraw: w, p_reinvest: r, p_topup: t });
  if (error || !res || res.error) {
    const e = res && res.error;
    msgEl.textContent = e === 'not_enough_profit' ? `There is only ${fmtKwacha(res.retained)} of profit in the business.`
      : e === 'insufficient_cash' ? `You only have ${fmtKwacha(res.cash)} available.`
      : e === 'bad_amount' ? 'Enter an amount to take home, reinvest, or add.' : 'Could not do that. Please try again.';
    msgEl.className = 'msg show error'; return;
  }
  closeModals(); await loadAll();
  if (window.StoryClient) await StoryClient.refresh();
}

async function buyCover(ventureId) {
  const { data: res, error } = await supabase.rpc('sim_buy_cover', { p_venture_id: ventureId });
  if (error || !res || res.error) {
    const e = res && res.error;
    alert(e === 'insufficient_cash' ? `Cover costs ${fmtKwacha(res.premium)} and you have ${fmtKwacha(res.cash)} in cash.`
      : e === 'already_covered' ? 'This venture is already covered.' : 'Could not buy cover. Please try again.');
    return;
  }
  if (window.StoryClient) StoryClient.toast('Covered for one game year. Premium paid: ' + fmtKwacha(res.premium));
  await loadAll();
}

function openNewVenture() {
  document.getElementById('newBackdrop').classList.add('show');
  document.getElementById('newModal').classList.add('show');
}

function openEvent(ventureId, kind) {
  activeVentureId = ventureId;
  eventKind = kind;
  document.getElementById('eventModalTitle').textContent =
    'Record an expense';
  document.getElementById('eventAmount').value = '';
  document.getElementById('eventDesc').value = '';
  document.getElementById('eventBackdrop').classList.add('show');
  document.getElementById('eventModal').classList.add('show');
}

function closeModals() {
  ['newBackdrop','newModal','eventBackdrop','eventModal','payBackdrop','payModal'].forEach(id =>
    document.getElementById(id).classList.remove('show'));
}

async function createVenture() {
  const msgEl = document.getElementById('newMsg');
  msgEl.className = 'msg';
  const name = document.getElementById('ventureName').value.trim();
  const category = document.getElementById('ventureCategory').value;
  const capital = parseFloat(document.getElementById('startingCapital').value);

  if (!name) { msgEl.textContent = 'Give your venture a name.'; msgEl.className = 'msg show error'; return; }
  if (!capital || capital <= 0) { msgEl.textContent = 'Enter starting capital greater than zero.'; msgEl.className = 'msg show error'; return; }
  if (capital > currentCash) { msgEl.textContent = `You only have ${fmtKwacha(currentCash)} in cash.`; msgEl.className = 'msg show error'; return; }

  const { data: res, error } = await supabase.rpc('sim_create_venture', { p_name: name, p_category: category, p_capital: capital });
  if (error || !res || res.error) {
    msgEl.textContent = res && res.error === 'insufficient_cash' ? `You only have ${fmtKwacha(res.cash)} in cash.` : 'Could not start the venture. Please try again.';
    msgEl.className = 'msg show error';
    return;
  }

  closeModals();
  await loadAll();
  if (window.StoryClient) await StoryClient.refresh();
}

async function confirmEvent() {
  const msgEl = document.getElementById('eventMsg');
  msgEl.className = 'msg';
  const amount = parseFloat(document.getElementById('eventAmount').value);
  const desc = document.getElementById('eventDesc').value.trim();

  if (!amount || amount <= 0) { msgEl.textContent = 'Enter an amount greater than zero.'; msgEl.className = 'msg show error'; return; }

  const signedAmount = -amount;

  const { data: res, error } = await supabase.rpc('sim_log_venture_event', {
    p_venture_id: activeVentureId, p_kind: eventKind, p_amount: amount, p_desc: desc || null
  });
  if (error || !res || res.error) {
    const e = res && res.error;
    msgEl.textContent = e === 'insufficient_cash' ? `You only have ${fmtKwacha(res.cash)} in cash.`
      : 'Could not save that entry. Please try again.';
    msgEl.className = 'msg show error';
    return;
  }

  closeModals();
  await loadAll();
  if (window.StoryClient) await StoryClient.refresh();
}
</script>
</body>
</html>
