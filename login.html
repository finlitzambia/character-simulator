<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Financial Character — FinLit Zambia</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --g:#22C55E;--gd:#15803D;--gx:#14532D;--gl:#F0FDF4;--gm:#DCFCE7;
  --gol:#C9A83C;--gold:#FDF8EC;--ink:#111827;--ink2:#374151;--ink3:#6B7280;
  --bg:#F8FAFC;--w:#ffffff;--bd:#E5E7EB;--bd2:#F3F4F6;
  --red:#DC2626;--redl:#FEF2F2;
  --ff:'DM Sans',system-ui,sans-serif;--fm:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.55}

.card{width:100%;max-width:400px;background:var(--w);border:1px solid var(--bd);
  border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(20,83,45,.08)}

.card-hdr{background:linear-gradient(140deg,var(--gx) 0%,#0a2617 100%);
  color:#fff;padding:28px 26px 24px}
.card-hdr .kicker{font-size:10px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--gol);margin-bottom:6px}
.card-hdr h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.card-hdr p{font-size:12.5px;color:rgba(255,255,255,.68);line-height:1.6}

.card-body{padding:26px}

.tabs{display:flex;gap:6px;background:var(--bd2);border-radius:11px;padding:4px;margin-bottom:22px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;
  color:var(--ink3);cursor:pointer;transition:all .15s;border:none;background:none;font-family:inherit}
.tab.active{background:var(--w);color:var(--gx);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;
  font-size:14px;font-family:inherit;color:var(--ink);background:var(--bg);transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--g);background:var(--w)}

.remember{display:flex;align-items:center;gap:9px;margin:18px 0;cursor:pointer}
.remember input{width:17px;height:17px;accent-color:var(--gd);cursor:pointer}
.remember span{font-size:12.5px;color:var(--ink2)}

.btn{width:100%;padding:12px;border-radius:11px;border:none;font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--gd);color:#fff}
.btn-primary:hover{background:var(--gx)}
.btn-primary:disabled{background:var(--bd);color:var(--ink3);cursor:not-allowed}

.msg{font-size:12.5px;border-radius:9px;padding:10px 13px;margin-bottom:15px;display:none;line-height:1.55}
.msg.show{display:block}
.msg.error{background:var(--redl);color:#7a1010}
.msg.info{background:var(--gl);color:var(--gx)}

.foot-note{text-align:center;font-size:11px;color:var(--ink3);margin-top:18px;line-height:1.6}
</style>
</head>
<body>

<div class="card">
  <div class="card-hdr">
    <div class="kicker">FinLit Zambia · Sandbox Tool</div>
    <h1>Your Financial Character</h1>
    <p>A separate practice account from your course login — track fake cash, investments, ventures, and debt as you learn.</p>
  </div>

  <div class="card-body">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Log in</button>
      <button class="tab" id="tabSignup" onclick="switchTab('signup')">Sign up</button>
    </div>

    <div class="msg" id="msg"></div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label for="displayName">What should we call your character?</label>
        <input type="text" id="displayName" placeholder="e.g. Mwansa" autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" required minlength="6">
      </div>

      <label class="remember">
        <input type="checkbox" id="rememberMe" checked>
        <span>Keep me logged in on this device</span>
      </label>

      <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>
    </form>

    <p class="foot-note">This is a practice tool with fake money only.<br>Your course progress on FinLit Zambia is tracked separately.</p>
  </div>
</div>

<!-- Supabase client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── Configuration ──────────────────────────────────────────────
// Replace with your actual Supabase project values (Settings → API).
// The anon key is safe to expose publicly — Row Level Security (see
// schema.sql) is what actually protects each learner's data.
const SUPABASE_URL = 'https://xzuroroziigcxctumjsr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6dXJvcm96aWlnY3hjdHVtanNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDA2MDgsImV4cCI6MjEwNTA3NjYwOH0.kqWBBe3nZ19Bcr5tsd8HqTNAwnY2vKTeBksFxZ--ods';

// The CDN script above already creates a global named `supabase` (that's
// where .createClient comes from) — so we overwrite it with a plain
// assignment instead of `const`, which would throw "Identifier 'supabase'
// has already been declared" and abort this whole script.
window.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── UI state ───────────────────────────────────────────────────
let mode = 'login'; // or 'signup'

function switchTab(next) {
  mode = next;
  document.getElementById('tabLogin').classList.toggle('active', next === 'login');
  document.getElementById('tabSignup').classList.toggle('active', next === 'signup');
  document.getElementById('nameField').style.display = next === 'signup' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = next === 'signup' ? 'Create my character' : 'Log in';
  hideMsg();
}

function showMsg(text, kind) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + kind;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

// ── Persistent session logic ──────────────────────────────────
// "Keep me logged in" controls WHERE Supabase stores the session token:
// localStorage (survives closing the browser) vs sessionStorage (cleared
// when the tab/browser closes). We never store the password itself —
// only a session token that proves this browser is authenticated.
function getStorageChoice() {
  const remember = document.getElementById('rememberMe').checked;
  return remember ? window.localStorage : window.sessionStorage;
}

// ── Form submit ──────────────────────────────────────────────
document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMsg();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;

  try {
    if (mode === 'signup') {
      const displayName = document.getElementById('displayName').value.trim() || 'Learner';

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;

      // Create the matching profile row (cash_balance defaults to 10000
      // per schema.sql, reputation_score defaults to 50).
      if (data.user) {
        await supabase.from('profiles').insert({
          id: data.user.id,
          display_name: displayName
        });
      }

      showMsg('Account created! Log in below to get started.', 'info');
      switchTab('login');
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;

      // Move the session into the chosen storage so "remember me" persists
      // (or doesn't) across browser restarts.
      if (data.session) {
        const storage = getStorageChoice();
        storage.setItem(
          'finlit-sim-session',
          JSON.stringify(data.session)
        );
      }

      window.location.href = 'index.html';
    }
  } catch (err) {
    showMsg(err.message || 'Something went wrong. Try again.', 'error');
  } finally {
    submitBtn.disabled = false;
  }
});

// ── On page load: if a valid session already exists, skip straight
// to the dashboard instead of showing the login form again. ──────
(async function checkExistingSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = 'index.html';
  }
})();
</script>
</body>
</html>
