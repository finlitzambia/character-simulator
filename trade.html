<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade — FinLit Zambia</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --g:#22C55E;--gd:#15803D;--gx:#14532D;--gl:#F0FDF4;--gm:#DCFCE7;
  --ink:#111827;--ink2:#374151;--ink3:#6B7280;--bg:#F8FAFC;--w:#ffffff;--bd:#E5E7EB;--bd2:#F3F4F6;
  --red:#DC2626;--redl:#FEF2F2;--ff:'DM Sans',system-ui,sans-serif;--fm:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:40px}

.topbar{background:var(--w);border-bottom:1px solid var(--bd);padding:16px 20px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.back{color:var(--ink3);text-decoration:none;font-size:20px}
.topbar h1{font-size:16px;font-weight:800}
.cash-pill{margin-left:auto;background:var(--gl);color:var(--gx);font-size:12px;
  font-weight:700;padding:6px 12px;border-radius:20px;font-family:var(--fm)}

.body{padding:16px 20px;max-width:640px;margin:0 auto}

.list-item{background:var(--w);border:1px solid var(--bd);border-radius:13px;
  padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;justify-content:between;
  gap:12px;cursor:pointer;transition:border-color .15s}
.list-item:hover{border-color:var(--g)}
.li-left{flex:1}
.li-ticker{font-size:13px;font-weight:800;color:var(--ink)}
.li-name{font-size:11.5px;color:var(--ink3)}
.li-price{font-family:var(--fm);font-size:14px;font-weight:700;color:var(--gx)}

.panel{display:none;background:var(--w);border:1px solid var(--bd);border-radius:16px;
  padding:20px;margin-top:16px}
.panel.show{display:block}
.panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-hdr h2{font-size:15px;font-weight:800}
.close-panel{background:none;border:none;font-size:18px;color:var(--ink3);cursor:pointer}

.side-toggle{display:flex;gap:8px;margin-bottom:16px}
.side-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--bd);
  background:var(--bg);font-family:inherit;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer}
.side-btn.active-buy{border-color:var(--g);background:var(--gl);color:var(--gx)}
.side-btn.active-sell{border-color:var(--red);background:var(--redl);color:#7a1010}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;
  font-size:14px;font-family:var(--fm);color:var(--ink);background:var(--bg)}
.field input:focus{outline:none;border-color:var(--g);background:var(--w)}

.total-row{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;
  border-top:1px solid var(--bd2);margin-bottom:14px}
.total-row .v{font-family:var(--fm);font-weight:800}

.btn{width:100%;padding:12px;border-radius:11px;border:none;font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer;background:var(--gd);color:#fff}
.btn:disabled{background:var(--bd);color:var(--ink3);cursor:not-allowed}

.msg{font-size:12px;border-radius:8px;padding:9px 12px;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg.error{background:var(--redl);color:#7a1010}
.msg.ok{background:var(--gl);color:var(--gx)}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">←</a>
  <h1>Trade</h1>
  <div class="cash-pill" id="cashPill">—</div>
</div>

<div class="body">
  <div id="instrumentList"></div>

  <div class="panel" id="tradePanel">
    <div class="panel-hdr">
      <h2 id="panelTitle">—</h2>
      <button class="close-panel" onclick="closePanel()">✕</button>
    </div>

    <div class="side-toggle">
      <button class="side-btn active-buy" id="buyBtn" onclick="setSide('buy')">Buy</button>
      <button class="side-btn" id="sellBtn" onclick="setSide('sell')">Sell</button>
    </div>

    <div class="msg" id="tradeMsg"></div>

    <div class="field">
      <label for="qty">Quantity</label>
      <input type="number" id="qty" min="0.0001" step="0.0001" placeholder="0">
    </div>

    <div class="total-row">
      <span>Price per unit</span>
      <span class="v" id="unitPrice">K 0.00</span>
    </div>
    <div class="total-row">
      <span>Total</span>
      <span class="v" id="totalValue">K 0.00</span>
    </div>

    <button class="btn" id="confirmBtn" onclick="confirmTrade()">Confirm Buy</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script>
let currentUser = null;
let currentCash = 0;
let selectedInstrument = null;
let selectedHoldingQty = 0;
let side = 'buy';

(async function init() {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const { data: profile } = await supabase
    .from('profiles').select('cash_balance').eq('id', currentUser.id).single();
  currentCash = Number(profile?.cash_balance || 0);
  document.getElementById('cashPill').textContent = fmtKwacha(currentCash);

  const { data: instruments } = await supabase
    .from('instruments').select('*').eq('is_active', true).order('ticker');

  const listEl = document.getElementById('instrumentList');
  listEl.innerHTML = (instruments || []).map(ins => `
    <div class="list-item" onclick='openPanel(${JSON.stringify(ins)})'>
      <div class="li-left">
        <div class="li-ticker">${ins.ticker} <span style="font-weight:400;color:var(--ink3)">· ${ins.kind.replace('_',' ')}</span></div>
        <div class="li-name">${ins.name}</div>
      </div>
      <div class="li-price">${fmtKwacha(ins.current_price)}</div>
    </div>
  `).join('') || '<p style="color:var(--ink3);font-size:13px">No instruments available yet.</p>';
})();

async function openPanel(instrument) {
  selectedInstrument = instrument;
  document.getElementById('panelTitle').textContent = instrument.ticker + ' — ' + instrument.name;
  document.getElementById('unitPrice').textContent = fmtKwacha(instrument.current_price);
  document.getElementById('qty').value = '';
  document.getElementById('totalValue').textContent = 'K 0.00';

  const { data: holding } = await supabase
    .from('holdings').select('quantity')
    .eq('profile_id', currentUser.id).eq('instrument_id', instrument.id).maybeSingle();
  selectedHoldingQty = Number(holding?.quantity || 0);

  setSide('buy');
  document.getElementById('tradePanel').classList.add('show');
  document.getElementById('tradePanel').scrollIntoView({ behavior: 'smooth' });
}

function closePanel() {
  document.getElementById('tradePanel').classList.remove('show');
  selectedInstrument = null;
}

function setSide(s) {
  side = s;
  document.getElementById('buyBtn').className = 'side-btn' + (s === 'buy' ? ' active-buy' : '');
  document.getElementById('sellBtn').className = 'side-btn' + (s === 'sell' ? ' active-sell' : '');
  document.getElementById('confirmBtn').textContent = s === 'buy' ? 'Confirm Buy' : 'Confirm Sell';
  document.getElementById('confirmBtn').style.background = s === 'buy' ? '' : 'var(--red)';
  updateTotal();
}

document.getElementById('qty').addEventListener('input', updateTotal);

function updateTotal() {
  const qty = parseFloat(document.getElementById('qty').value) || 0;
  const total = qty * (selectedInstrument?.current_price || 0);
  document.getElementById('totalValue').textContent = fmtKwacha(total);
}

async function confirmTrade() {
  const msgEl = document.getElementById('tradeMsg');
  msgEl.className = 'msg';
  const qty = parseFloat(document.getElementById('qty').value);
  const price = Number(selectedInstrument.current_price);
  const total = qty * price;

  if (!qty || qty <= 0) {
    msgEl.textContent = 'Enter a quantity greater than zero.';
    msgEl.className = 'msg show error';
    return;
  }
  if (side === 'buy' && total > currentCash) {
    msgEl.textContent = `You only have ${fmtKwacha(currentCash)} in cash.`;
    msgEl.className = 'msg show error';
    return;
  }
  if (side === 'sell' && qty > selectedHoldingQty) {
    msgEl.textContent = `You only hold ${selectedHoldingQty} of this instrument.`;
    msgEl.className = 'msg show error';
    return;
  }

  const confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.disabled = true;

  try {
    // 1. Record the trade
    const { data: trade, error: tradeErr } = await supabase.from('trades').insert({
      profile_id: currentUser.id,
      instrument_id: selectedInstrument.id,
      side,
      quantity: qty,
      price_at_trade: price,
      total_value: total
    }).select().single();
    if (tradeErr) throw tradeErr;

    // 2. Move cash
    const cashDelta = side === 'buy' ? -total : total;
    const newCash = currentCash + cashDelta;
    await supabase.from('cash_ledger').insert({
      profile_id: currentUser.id,
      amount: cashDelta,
      reason: side === 'buy' ? 'trade_buy' : 'trade_sell',
      related_table: 'trades',
      related_id: trade.id
    });
    await supabase.from('profiles').update({ cash_balance: newCash }).eq('id', currentUser.id);

    // 3. Update holdings (upsert with recalculated average buy price on buy)
    const newQty = side === 'buy' ? selectedHoldingQty + qty : selectedHoldingQty - qty;
    await supabase.from('holdings').upsert({
      profile_id: currentUser.id,
      instrument_id: selectedInstrument.id,
      quantity: newQty,
      avg_buy_price: price // simplified v1: latest trade price; refine to weighted avg later
    }, { onConflict: 'profile_id,instrument_id' });

    msgEl.textContent = `${side === 'buy' ? 'Bought' : 'Sold'} ${qty} ${selectedInstrument.ticker}.`;
    msgEl.className = 'msg show ok';
    currentCash = newCash;
    document.getElementById('cashPill').textContent = fmtKwacha(currentCash);
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  } catch (err) {
    msgEl.textContent = err.message || 'Trade failed. Try again.';
    msgEl.className = 'msg show error';
  } finally {
    confirmBtn.disabled = false;
  }
}
</script>
</body>
</html>
