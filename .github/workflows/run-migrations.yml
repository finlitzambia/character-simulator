name: Run database migrations

# Run this by hand: Actions tab -> "Run database migrations" -> Run workflow.
# It applies every numbered file in db/ (01 to 17 and any you add later), in order.
# All of them are safe to run again, so re-running after an edit is fine.
# schema.sql and seed_instruments.sql are NOT included: run those once by hand on a brand-new database.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SQL files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in $(ls db/[0-9][0-9]-*.sql | sort); do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
